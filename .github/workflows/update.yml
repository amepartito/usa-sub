name: Multi-country Shadowsocks Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: shadowmere-multicountry-sub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build all available countries from Shadowmere
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import binascii
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          B64_URL = 'https://shadowmere.xyz/api/b64sub/'
          COUNTRY_CODES_URL = 'https://shadowmere.xyz/api/country-codes/'
          FLAG_RE = re.compile(r'^([\U0001f1e6-\U0001f1ff]{2})(?:\s|$)')
          CODE_RE = re.compile(r'^[a-z]{2}$')
          LABELS_FA = {
              'us': 'آمریکا', 'fr': 'فرانسه', 'de': 'آلمان', 'gb': 'بریتانیا',
              'ca': 'کانادا', 'nl': 'هلند', 'se': 'سوئد', 'ch': 'سوئیس',
              'tr': 'ترکیه', 'ae': 'امارات', 'jp': 'ژاپن', 'kr': 'کره جنوبی',
              'sg': 'سنگاپور', 'au': 'استرالیا', 'it': 'ایتالیا', 'es': 'اسپانیا',
              'at': 'اتریش', 'be': 'بلژیک', 'fi': 'فنلاند', 'no': 'نروژ',
              'dk': 'دانمارک', 'pl': 'لهستان', 'ru': 'روسیه', 'br': 'برزیل',
              'in': 'هند', 'hk': 'هنگ‌کنگ', 'ie': 'ایرلند', 'pt': 'پرتغال',
              'cz': 'چک', 'ro': 'رومانی', 'ua': 'اوکراین', 'tw': 'تایوان',
              'id': 'اندونزی', 'th': 'تایلند', 'vn': 'ویتنام', 'my': 'مالزی',
              'il': 'اسرائیل', 'ar': 'آرژانتین', 'mx': 'مکزیک', 'za': 'آفریقای جنوبی',
          }


          def get_bytes(url, attempts=3):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Shadowmere-Multicountry/1.0 (GitHub Actions)',
                  'Accept': 'text/plain, application/json;q=0.9, */*;q=0.8',
              })
              for n in range(attempts):
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          if response.status != 200:
                              raise RuntimeError(f'Upstream status: {response.status}')
                          result = response.read(12 * 1024 * 1024 + 1)
                          if len(result) > 12 * 1024 * 1024:
                              raise RuntimeError('Upstream response exceeded 12 MiB')
                          return result
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError) as exc:
                      if n == attempts - 1:
                          raise RuntimeError(f'Source unavailable: {url}') from exc
                      print(f'Retry {n+1}: {type(exc).__name__}', flush=True)
                      time.sleep(20 if n == 0 else 65)


          def parse_b64_feed(payload):
              encoded = re.sub(rb'\s+', b'', payload)
              if not encoded or len(encoded) > 12 * 1024 * 1024:
                  raise ValueError('Invalid/oversized subscription response')
              encoded += b'=' * (-len(encoded) % 4)
              try:
                  plain = base64.b64decode(encoded, validate=True).decode('utf-8')
              except (binascii.Error, UnicodeDecodeError) as exc:
                  raise ValueError('Subscription response is not a valid Base64 UTF-8 feed') from exc
              groups = defaultdict(list)
              seen = defaultdict(set)
              dropped = 0
              for line in plain.splitlines():
                  line = line.strip()
                  if not line.startswith('ss://') or '#' not in line:
                      dropped += 1
                      continue
                  uri, fragment = line.split('#', 1)
                  label = urllib.parse.unquote(fragment).strip()
                  match = FLAG_RE.match(label)
                  if not match:
                      dropped += 1
                      continue
                  flag_emoji = match.group(1)
                  country = ''.join(chr(ord(char) - 0x1F1E6 + ord('a')) for char in flag_emoji)
                  if not CODE_RE.fullmatch(country):
                      dropped += 1
                      continue
                  if uri in seen[country]:
                      continue
                  seen[country].add(uri)
                  groups[country].append(uri + '#' + urllib.parse.quote(label, safe=''))
              if not groups:
                  raise ValueError('No country-tagged Shadowsocks nodes found; existing files left untouched')
              return dict(groups), dropped


          def names_for_active_countries():
              try:
                  import json
                  data = json.loads(get_bytes(COUNTRY_CODES_URL, attempts=1).decode('utf-8'))
                  if not isinstance(data, list):
                      return {}
                  return {
                      item['code'].lower(): item['name']
                      for item in data
                      if isinstance(item, dict)
                      and isinstance(item.get('code'), str)
                      and CODE_RE.fullmatch(item['code'].lower())
                      and isinstance(item.get('name'), str)
                  }
              except (ValueError, UnicodeDecodeError, RuntimeError):
                  print('Country name API unavailable; using country codes.', flush=True)
                  return {}


          def flag_for_code(code):
              return ''.join(chr(0x1F1E6 + ord(char) - ord('a')) for char in code)


          def write_outputs(groups, country_names, repo, branch):
              out = Path('subs')
              out.mkdir(exist_ok=True)
              # Remove only files managed by this workflow, never unrelated repository files.
              for previous in out.iterdir():
                  if not previous.is_file():
                      continue
                  managed_code = previous.name[:-4] if previous.name.endswith('.txt') else previous.name
                  if CODE_RE.fullmatch(managed_code) and managed_code not in groups:
                      previous.unlink()

              base = f'https://raw.githubusercontent.com/{repo}/{branch}/subs/'
              rows = []
              for code in sorted(groups):
                  data = ('\n'.join(groups[code]) + '\n').encode('utf-8')
                  encoded = base64.b64encode(data).decode('ascii') + '\n'
                  (out / code).write_text(encoded, encoding='ascii')
                  (out / f'{code}.txt').write_text(encoded, encoding='ascii')
                  country = country_names.get(code) or code.upper()
                  country = country.replace('|', '\\|').replace('\n', ' ')
                  fa_name = LABELS_FA.get(code, '—')
                  rows.append(f'| {flag_for_code(code)} | {fa_name} | {country} | `{code}` | {len(groups[code])} | [لینک ساب]({base}{code}) |')

              # Preserve the previous Hiddify/Streisand US subscription URL.
              if 'us' in groups:
                  (Path('us.txt')).write_text((out / 'us').read_text(encoding='ascii'), encoding='ascii')
              else:
                  # No stale US nodes when the source no longer has active US proxies.
                  Path('us.txt').write_text('', encoding='ascii')

              header = (
                  '# راهنمای سابسکریپشن کشورهای Shadowmere\n\n'
                  'فقط دو حرف انتهای لینک را عوض کنید؛ مثلاً `.../subs/us`، `.../subs/fr`، `.../subs/de`.\n\n'
                  'این جدول فقط کشورهایی را نشان می‌دهد که در آخرین به‌روزرسانی واقعاً کانفیگ فعال داشته‌اند.\n'
                  'نام فعال در Shadowmere الزاماً به معنی اتصال موفق از اینترنت شما نیست.\n\n'
                  f'**قالب لینک:** `{base}' + '<code>`\n\n'
                  '| پرچم | نام فارسی | نام کشور در منبع | کد | تعداد کانفیگ | لینک |\n'
                  '|---|---|---|---|---:|---|\n'
              )
              Path('COUNTRIES.md').write_text(header + '\n'.join(rows) + '\n', encoding='utf-8')
              print(f'Generated {len(groups)} countries and {sum(map(len, groups.values()))} nodes.', flush=True)


          def main():
              repo = os.environ.get('GITHUB_REPOSITORY', 'amepartito/usa-sub')
              branch = os.environ.get('GITHUB_REF_NAME', 'main')
              groups, dropped = parse_b64_feed(get_bytes(B64_URL))
              print(f'Skipped {dropped} invalid or country-unknown lines.', flush=True)
              names = names_for_active_countries()
              write_outputs(groups, names, repo, branch)


          if __name__ == '__main__':
              main()
          PYTHON

      - name: Publish subscriptions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- subs/ COUNTRIES.md us.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update country subscriptions'
            git push
          else
            echo 'Subscriptions unchanged'
          fi
