name: Shadowmere Country Subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: shadowmere-country-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install QR generator
        run: python -m pip install --disable-pip-version-check 'qrcode[pil]==8.2'

      - name: Generate country subscriptions, QR images and Persian guides
        shell: bash
        run: |
          python - <<'PYTHON'
          import base64
          import binascii
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          import qrcode

          SOURCE = 'https://shadowmere.xyz/api/b64sub/'
          COUNTRY_NAMES = 'https://shadowmere.xyz/api/country-codes/'
          FLAG_RE = re.compile(r'^([\U0001F1E6-\U0001F1FF]{2})(?:\s|$)')
          COUNTRY_RE = re.compile(r'^[a-z]{2}$')
          FA = {
              'ae': 'امارات', 'al': 'آلبانی', 'ar': 'آرژانتین',
              'at': 'اتریش', 'au': 'استرالیا', 'be': 'بلژیک',
              'br': 'برزیل', 'ca': 'کانادا', 'ch': 'سوئیس',
              'cl': 'شیلی', 'cn': 'چین', 'cz': 'چک',
              'de': 'آلمان', 'dk': 'دانمارک', 'eg': 'مصر',
              'es': 'اسپانیا', 'fi': 'فنلاند', 'fr': 'فرانسه',
              'gb': 'بریتانیا', 'gr': 'یونان', 'hk': 'هنگ‌کنگ',
              'hu': 'مجارستان', 'id': 'اندونزی', 'ie': 'ایرلند',
              'il': 'اسرائیل', 'in': 'هند', 'ir': 'ایران',
              'it': 'ایتالیا', 'jp': 'ژاپن', 'kr': 'کره جنوبی',
              'lu': 'لوکزامبورگ', 'mx': 'مکزیک', 'my': 'مالزی',
              'nl': 'هلند', 'no': 'نروژ', 'nz': 'نیوزیلند',
              'ph': 'فیلیپین', 'pl': 'لهستان', 'pt': 'پرتغال',
              'ro': 'رومانی', 'ru': 'روسیه', 'sa': 'عربستان',
              'se': 'سوئد', 'sg': 'سنگاپور', 'th': 'تایلند',
              'tr': 'ترکیه', 'tw': 'تایوان', 'ua': 'اوکراین',
              'uk': 'بریتانیا', 'us': 'آمریکا', 'vn': 'ویتنام',
              'za': 'آفریقای جنوبی',
          }

          def fetch(url, retries=3):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Country-Subs-GitHub/3.0',
                  'Accept': 'text/plain,application/json;q=0.9,*/*;q=0.5',
              })
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          if response.status != 200:
                              raise RuntimeError('Source HTTP ' + str(response.status))
                          content = response.read(12 * 1024 * 1024 + 1)
                          if len(content) > 12 * 1024 * 1024:
                              raise RuntimeError('Source content too large')
                          return content
                  except (urllib.error.HTTPError, urllib.error.URLError,
                          TimeoutError, OSError) as exc:
                      if attempt == retries - 1:
                          raise RuntimeError('Source unavailable: ' + url) from exc
                      print('Retry source:', type(exc).__name__, flush=True)
                      time.sleep(20 if attempt == 0 else 65)

          def parse_feed(raw):
              encoded = re.sub(rb'\s+', b'', raw)
              if not encoded:
                  raise RuntimeError('Empty subscription from source')
              encoded += b'=' * (-len(encoded) % 4)
              try:
                  plain = base64.b64decode(encoded, validate=True).decode('utf-8')
              except (binascii.Error, UnicodeDecodeError) as exc:
                  raise RuntimeError('Invalid Base64 subscription') from exc
              groups = defaultdict(list)
              seen = defaultdict(set)
              invalid = 0
              for line in plain.splitlines():
                  line = line.strip()
                  if not line.startswith('ss://') or '#' not in line:
                      invalid += 1
                      continue
                  uri, fragment = line.split('#', 1)
                  if not uri[5:]:
                      invalid += 1
                      continue
                  label = urllib.parse.unquote(fragment).strip()
                  match = FLAG_RE.match(label)
                  if not match:
                      invalid += 1
                      continue
                  code = ''.join(chr(ord(c) - 0x1F1E6 + ord('a')) for c in match.group(1))
                  if not COUNTRY_RE.fullmatch(code):
                      invalid += 1
                      continue
                  if uri in seen[code]:
                      continue
                  seen[code].add(uri)
                  groups[code].append(uri + '#' + urllib.parse.quote(label, safe=''))
              if not groups:
                  raise RuntimeError('No country-tagged servers; existing published files preserved')
              return dict(groups), invalid

          def optional_country_names():
              try:
                  data = json.loads(fetch(COUNTRY_NAMES, retries=1).decode('utf-8'))
                  if not isinstance(data, list):
                      return {}
                  return {
                      row['code'].lower(): row['name']
                      for row in data
                      if isinstance(row, dict)
                      and isinstance(row.get('code'), str)
                      and COUNTRY_RE.fullmatch(row['code'].lower())
                      and isinstance(row.get('name'), str)
                  }
              except (RuntimeError, ValueError, UnicodeDecodeError):
                  print('Country names unavailable; fallback labels are sufficient.')
                  return {}

          def flag(code):
              return ''.join(chr(0x1F1E6 + ord(c) - ord('a')) for c in code)

          def safe_cell(value):
              return str(value).replace('|', '\\|').replace('\r', ' ').replace('\n', ' ')

          def make_qr(url, filename):
              qr = qrcode.QRCode(
                  version=6,
                  error_correction=qrcode.constants.ERROR_CORRECT_M,
                  box_size=9,
                  border=4,
              )
              qr.add_data(url)
              qr.make(fit=True)
              qr.make_image(fill_color='black', back_color='white').save(filename, format='PNG', optimize=True)

          def publish_files(groups, names, repo, branch):
              out = Path('subs')
              qrs = Path('qr')
              out.mkdir(exist_ok=True)
              qrs.mkdir(exist_ok=True)

              # Only remove files owned by this workflow; preserve unrelated repository files.
              for entry in out.iterdir():
                  if entry.is_file() and (
                      COUNTRY_RE.fullmatch(entry.name)
                      or (entry.name.endswith('.txt') and COUNTRY_RE.fullmatch(entry.name[:-4]))
                  ):
                      entry.unlink()
              for entry in qrs.iterdir():
                  if entry.is_file() and entry.suffix == '.png' and COUNTRY_RE.fullmatch(entry.stem):
                      entry.unlink()
              Path('us.txt').unlink(missing_ok=True)

              base = f'https://raw.githubusercontent.com/{repo}/{branch}/subs/'
              rows = []
              for code, nodes in sorted(groups.items()):
                  url = base + code
                  payload = ('\n'.join(nodes) + '\n').encode('utf-8')
                  (out / code).write_text(base64.b64encode(payload).decode('ascii') + '\n', encoding='ascii')
                  make_qr(url, qrs / f'{code}.png')
                  country = safe_cell(names.get(code) or code.upper())
                  persian = FA.get(code, '—')
                  rows.append(
                      f'| {flag(code)} | {persian} | {country} | `{code}` | {len(nodes)} | '
                      f'[لینک ساب]({url}) | [📷 QR](qr/{code}.png) |'
                  )

              total = sum(len(items) for items in groups.values())
              link = f'https://github.com/{repo}/blob/{branch}/COUNTRIES.md'
              actions = f'https://github.com/{repo}/actions/workflows/update.yml'
              sample = [c for c in ('us','fr','de','gb','nl','ca','jp') if c in groups]
              if len(sample) < 3:
                  sample = sorted(groups)[:7]
              examples = '\n'.join(
                  f'| {flag(c)} {FA.get(c, names.get(c, c.upper()))} | `{c}` | '
                  f'[لینک ساب]({base}{c}) | [📷 QR](qr/{c}.png) |'
                  for c in sample
              )
              qr_preview = '\n'.join(
                  f'<a href="qr/{c}.png"><img src="qr/{c}.png" width="120" '
                  f'alt="QR subscription {c.upper()}"></a>' for c in sample[:5]
              )
              readme = f'''# 🌍 سابسکریپشن Shadowmere بر اساس کشور

          [![Subscription Update](https://github.com/{repo}/actions/workflows/update.yml/badge.svg)]({actions})

          **{len(groups)} کشور و {total} کانفیگ** در آخرین دریافت موفق ثبت شده‌اند. هر کشور یک لینک ثابت و یک QR Code مخصوص خودش دارد.

          ## 🔗 لینک ثابت کشورها

          ```text
          {base}<code>
          ```

          فقط دو حرف آخر لینک را تغییر بده: `us` آمریکا، `fr` فرانسه، `de` آلمان و غیره. کدها حروف کوچک هستند.

          | کشور | کد | اشتراک | QR Code |
          |---|---|---|---|
          {examples}

          **[🌐 فهرست تمام کشورها، تعداد کانفیگ‌ها و QR مخصوص هر کشور]({link})**

          ## 📷 QR Code آماده اسکن

          {qr_preview}

          این QRها **آدرس سابسکریپشن** را دارند، نه تنظیمات یک سرور؛ با آپدیت فهرست سرورها نیازی به تغییر یا اسکن دوباره QR نیست.

          - با یک دستگاه QR را باز کن؛ در گوشی دوم وارد `Hiddify` یا `Streisand` شو، `+` و سپس `Scan QR` را بزن.
          - اگر تنها یک گوشی داری، لینک کشور را کپی کن؛ یا اگر برنامه امکان خواندن QR از گالری را دارد، تصویر را ذخیره و از گالری انتخاب کن.
          - بعد از وارد شدن پروفایل، با گزینه `Update/Refresh` فهرست جدید سرورها را دریافت کن.

          ## 🔄 به‌روزرسانی خودکار

          - GitHub Actions هر **۳ ساعت** تلاش می‌کند داده‌های تازه Shadowmere را دریافت کند؛ اجرای زمان‌بندی‌شده ممکن است تأخیر داشته باشد.
          - ساب‌ها در `subs/xx` و تصویرهای QR در `qr/xx.png` منتشر می‌شوند.
          - اگر دریافت منبع ناموفق شود، اجرا با خطا متوقف می‌شود و فایل‌های منتشرشده قبلی دست‌نخورده می‌مانند.
          - اگر کشوری دیگر سرور فعال برچسب‌دار نداشته باشد، فایل ساب و QR آن کشور در اجرای موفق بعدی حذف می‌شوند.
          - [نمایش اجراها و اجرای دستی]({actions})

          ## 🧹 ساختار پروژه

          ```text
          .github/workflows/update.yml    به‌روزرسانی خودکار
          subs/us                         ساب آمریکا
          subs/fr                         ساب فرانسه
          subs/de                         ساب آلمان
          qr/us.png                       QR آمریکا
          qr/fr.png                       QR فرانسه
          qr/de.png                       QR آلمان
          COUNTRIES.md                    فهرست خودکار کشورها و QRها
          README.md                       راهنمای فارسی در GitHub
          ```

          فایل قدیمی `us.txt` و فایل‌های تکراری `.txt` ساخته نمی‌شوند. **لینک نهایی آمریکا همیشه `.../subs/us` است.**

          ## ⚠️ نکات مهم

          - منبع: [Shadowmere](https://shadowmere.xyz/)؛ تنها پروتکل **Shadowsocks** و فرمت Base64 از منبع فعلی منتشر می‌شود.
          - فعال‌بودن سرور نزد Shadowmere به معنی اتصال تضمینی از اینترنت تو نیست.
          - کشور از پرچم کنار نام کانفیگ مشخص می‌شود، نه تست مستقل موقعیت IP خروجی.
          - این پروژه صرفاً کانفیگ‌های منبع عمومی را تفکیک می‌کند و سرور VPN ارائه نمی‌دهد.
          '''
              Path('README.md').write_text(readme, encoding='utf-8')
              countries = (
                  '# 🌐 فهرست خودکار کشورهای Shadowmere و QR Code\n\n'
                  f'**{len(groups)} کشور · {total} کانفیگ** در آخرین دریافت موفق.\n\n'
                  f'**قالب لینک ساب:** `{base}<code>`\n\n'
                  '[راهنمای فارسی](README.md) · '
                  f'[وضعیت GitHub Actions]({actions})\n\n'
                  '| پرچم | نام فارسی | نام در منبع | کد | تعداد سرور | لینک ساب | QR Code |\n'
                  '|---|---|---|---|---:|---|---|\n'
                  + '\n'.join(rows) + '\n\n'
                  '> برای بازکردن تصویر QR روی لینک ستون آخر بزن. کشورهای بدون سرور فعال در این جدول نمی‌آیند.\n'
              )
              Path('COUNTRIES.md').write_text(countries, encoding='utf-8')
              print(f'Generated {len(groups)} countries, {total} nodes and {len(groups)} QR images.', flush=True)

          def main():
              repo = os.getenv('GITHUB_REPOSITORY', 'amepartito/usa-sub')
              branch = os.getenv('GITHUB_REF_NAME', 'main')
              groups, invalid = parse_feed(fetch(SOURCE))
              print(f'Skipped {invalid} invalid or missing-country nodes.', flush=True)
              names = optional_country_names()
              publish_files(groups, names, repo, branch)

          if __name__ == '__main__':
              main()
          PYTHON

      - name: Commit subscriptions, QR images and GitHub guides
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- subs qr README.md COUNTRIES.md
          if git ls-files --error-unmatch us.txt >/dev/null 2>&1; then
            git add -u -- us.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish country subscriptions with QR codes and Persian guides'
            git push
          else
            echo 'No content changes to publish'
          fi
